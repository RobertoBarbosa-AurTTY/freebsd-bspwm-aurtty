# freebsd-bspwm-aurtty: firewall padrão (pf) para estação de trabalho.
# Bloqueia o que chega de fora, libera tudo que sai do PC.
# Bloqueios ficam registrados em /var/log/pflog (pflogd).
# Ver: doas pfctl -s rules | doas pftop | menu de rede da barra.
# Para liberar uma porta de entrada, ex. 8080: pass in proto tcp to port 8080

set skip on lo0
set block-policy return
scrub in all

block in log all
pass out all keep state

# ping de volta e "fragmentation needed" (descoberta de MTU)
pass in inet proto icmp icmp-type { echoreq, unreach }
# IPv6 precisa de ICMPv6 (descoberta de vizinhos e de roteador)
pass in inet6 proto icmp6 all
