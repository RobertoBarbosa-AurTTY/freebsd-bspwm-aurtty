;; freebsd-bspwm-aurtty: dock flutuante embaixo (atalhos rápidos)
;; Subida pelo bars/bar07/Bar.bash junto com a barra de cima. O instalador tira os
;; ícones dos programas que não foram instalados e ajusta a largura.

[global/wm]
include-file = ../config/system.ini
include-file = colors.ini

[bar/aurtty-dock]
monitor = ${env:MONITOR:}
bottom = true
override-redirect = false
width = 248
height = 46
offset-x = 50%:-124
offset-y = 8
radius = 14.0
background = ${color.bg}
foreground = ${color.fg}
border-size = 6px
border-color = ${color.bg}
padding = 1
module-margin = 1
fixed-center = true
font-0 = "JetBrainsMono Nerd Font Propo:size=21;6"
font-1 = "JetBrainsMono:style=Bold:pixelsize=9;3"
modules-center = dock-term dock-chrome dock-code dock-ia
cursor-click = pointer
enable-ipc = true
wm-restack = bspwm

[module/dock-term]
type = custom/text
format = ""
format-foreground = ${color.green}
click-left = OpenApps --terminal &

[module/dock-chrome]
type = custom/text
format = ""
format-foreground = ${color.yellow}
click-left = google-chrome &

[module/dock-code]
type = custom/text
format = "󰨞"
format-foreground = ${color.blue}
click-left = code &

[module/dock-ia]
type = custom/text
format = "󰚩"
format-foreground = ${color.magenta}
click-left = alacritty --class AurttyIA,AurttyIA -e aichat &
