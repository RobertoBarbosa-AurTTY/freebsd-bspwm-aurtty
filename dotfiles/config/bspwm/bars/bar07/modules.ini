[module/bi]
type = custom/text
label = "%{T5}%{T-}"
label-foreground = ${color.pill}
label-background = ${color.bg}

[module/bd]
type = custom/text
label = "%{T5}%{T-}"
label-foreground = ${color.pill}
label-background = ${color.bg}

######################################################

[module/date]
type = internal/date

interval = 1.0

time = %H:%M
format-background = ${color.pill}
format-foreground = ${color.fg}

format = %{A1:gsimplecal:}<label>%{A}
format-prefix =
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.blue-gray}

label = "%time%%date%"

######################################################

[module/filesystem]
type = custom/script
exec = FsUsage /

interval = 60

format = %{A1:aurtty-painel disco:}%{A3:aurtty-painel pastas:}<label>%{A}%{A}
format-prefix = "%{A1:aurtty-painel disco:}%{A3:aurtty-painel pastas:} %{A}%{A}"
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.yellow}


label = %output%
label-background = ${color.pill}


######################################################

[module/network]
type = custom/script
exec = NetStatus

interval = 3

format = <label>
format-prefix = " "
format-prefix-font = 2
format-background = ${color.pill}
format-foreground = ${color.green}

label = "%{A1:OpenApps --netmanager:}%output%%{A}"
label-background = ${color.pill}
label-foreground = ${color.fg}



######################################################

[module/pulseaudio]
type = internal/pulseaudio

;;sink = alsa_output.pci-0000_00_1b.0.analog-stereo
use-ui-max = true
interval = 5

format-volume = <label-volume>
format-volume-prefix = ""
format-volume-prefix-font = 2
format-volume-background = ${color.pill}
format-volume-foreground = ${color.indigo}

label-volume = " %percentage% "
label-volume-background = ${color.pill}
label-volume-foreground = ${color.fg}

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-font = 2
format-muted-foreground = ${color.indigo}
format-muted-background = ${color.pill}
label-muted = " Muted "
label-muted-foreground = ${color.red}
label-muted-background = ${color.pill}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 = 

click-right = OpenApps --soundcontrol

######################################################

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = <ramp><label>
label = %percentage%%
label-padding-left = 3pt

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 2
ramp-foreground = ${color.yellow}

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = <animation-charging><label-charging>
format-charging-background = ${color.pill}
label-charging = %percentage%%
label-charging-padding-left = 3pt
label-charging-padding-right = 7pt

format-discharging = <ramp-capacity><label-discharging>
format-discharging-background = ${color.pill}
label-discharging = %percentage%%
label-discharging-padding-left = 3pt
label-discharging-padding-right = 7pt

format-full = <label-full>
format-full-background = ${color.pill}
format-full-prefix = 
format-full-prefix-font = 2
format-full-prefix-foreground = ${color.green}
label-full = %percentage%%
label-full-padding-left = 3pt
label-full-padding-right = 7pt

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${color.blue}
ramp-capacity-font = 2

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${color.green}
animation-charging-font = 2
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = " %output% "

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>
format-font = 3

label-focused = 
label-focused-font = 7
label-focused-background = ${color.pill}
label-focused-padding = 1
label-focused-foreground = ${color.blue-arch}

label-occupied = 󰊠
label-occupied-padding = 1
label-occupied-background = ${color.pill}
label-occupied-foreground= ${color.blue}

label-urgent = 󰊠
label-urgent-padding = 1
label-urgent-background = ${color.pill}
label-urgent-foreground= ${color.blue}

label-empty = 󰑊
label-empty-padding = 1
label-empty-background = ${color.pill}
label-empty-foreground = ${color.purple}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = " "
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.lime}

label = %output%
label-background = ${color.pill}

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = 
label-foreground = ${color.blue-arch}
label-font = 6

click-left = OpenApps --menu
click-right = RiceSelector

######################################################

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg}

######################################################

[module/dots]
type = custom/text
label = " 󰇙 "
label-font = 3
label-foreground = ${color.blue-gray}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-prefix = " "
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.red}

label = "%percentage%%"
label-background = ${color.pill}

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = %{A1:aurtty-painel ram:}<label>%{A}
format-prefix = "%{A1:aurtty-painel ram:} %{A}"
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.cyan}

label = %used%
label-background = ${color.pill}

######################################################

[module/mpd_control]
type            = internal/mpd
host            = 127.0.0.1
port            = 6600
interval        = 2
format-online   = <icon-prev><toggle><icon-next>
format-offline  = <label-offline>
label-offline = "󰝛 No Music"
icon-play               = " %{T2} "
icon-pause              = " %{T2} "
icon-stop               = " %{T2} "
icon-prev               = "%{T2} "
icon-next               = " %{T2}"

format-offline-background = ${color.pill}
format-offline-foreground = ${color.black-bright}
icon-play-background    = ${color.pill}
icon-pause-background   = ${color.pill}
icon-stop-background    = ${color.pill}
icon-prev-background    = ${color.pill}
icon-next-background    = ${color.pill}
icon-repeat-background  = ${color.pill}
icon-play-foreground    = ${color.green-bright}
icon-pause-foreground   = ${color.green-bright}
icon-stop-foreground    = ${color.green-bright}
icon-prev-foreground    = ${color.blue}
icon-next-foreground    = ${color.blue}
toggle-on-foreground    = ${color.green}
toggle-off-foreground   = ${color.red}

[module/mpd]
type                    = internal/mpd
host                    = 127.0.0.1
port                    = 6600
interval        		= 2
format-online           = "%{F#9ece6a}[%{F-} %{A1:OpenApps --music:}<label-song>%{A} %{F#9ece6a}]%{F-}"
format-offline          = ""
label-song              = "%title%"
label-song-maxlen		= 18

#####################################################

[module/mplayer]
type = custom/text
label = ""
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label =  ""
label-foreground = ${color.cyan}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = ""
label-foreground = ${color.red}

click-left = OpenApps --powermenu

#####################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 8px
tray-padding = 0px
tray-size = 63%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 3
label = "%output%"
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.cyan}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

#####################################################

[module/colorpicker]
type = custom/text
label = ""
label-foreground = ${color.green}
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 3
click-left = Layout next
click-right = Layout prev
